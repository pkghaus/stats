version: 2

updates:
  # Every action here is first-party actions/* on a major tag, which this
  # bumps. The shellcheck and actionlint images are pinned by digest in run:
  # lines, which Dependabot never reads, so those move by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # wrangler is pinned exactly and deploys pkghaus-stats, the reader on
  # apt.pkg.haus/stats*. Pinning is what stops it changing on its own; this is
  # what stops it going stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
