name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Syntax-check the worker
        run: node --check src/worker.js

      - name: Test the worker
        run: npm test

      # test/schema.sql is a byte-identical copy of pkghaus/apt's
      # worker/schema.sql, which creates the tables this Worker reads.
      - name: Diff the test schema against pkghaus/apt
        env:
          RAW: https://raw.githubusercontent.com/pkghaus/apt/master/worker/schema.sql
        run: |
          curl -fsSL --retry 5 --retry-delay 3 \
            -o /tmp/apt-schema.sql "$RAW"
          if ! diff -u /tmp/apt-schema.sql test/schema.sql; then
            echo "::error::test/schema.sql has drifted from pkghaus/apt worker/schema.sql"
            exit 1
          fi

      # contrib/apt-stats is a POSIX sh client of /stats.json with its own
      # golden-file suite, and that suite runs shellcheck over both scripts
      # as its last section. Running it here is what stops the contrib tree
      # from rotting: it consumes the JSON shape this worker emits.
      - name: Test the apt-stats client
        run: sh contrib/apt-stats/tests/run.sh

      - name: shellcheck
        # Pinned by digest, matching pkghaus/apt and pkghaus/action-debian-build.
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh

      - name: actionlint
        # Pinned by digest; go-yaml inside it also rejects duplicate mapping
        # keys, which GitHub's parser rejects but many local checks accept.
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
