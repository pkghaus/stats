name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Syntax-check the worker
        run: node --check src/worker.js

      - name: Resolve the D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotent: create on first run, then resolve the id by name and
        # pin it into wrangler.toml for this deploy.
        run: |
          npx wrangler@4 d1 create pkghaus-stats 2>/dev/null || true
          id="$(npx wrangler@4 d1 list --json | jq -r '.[] | select(.name == "pkghaus-stats") | .uuid')"
          test -n "$id"
          sed -i "s/PLACEHOLDER_RESOLVED_IN_CI/$id/" wrangler.toml
          grep -A2 'd1_databases' wrangler.toml | grep -v "$id" || true

      - name: Apply the schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 d1 execute pkghaus-stats --remote --file schema.sql

      - name: Deploy the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
