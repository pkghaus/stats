name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # wrangler is a pinned devDependency, not `npx wrangler@4`. It runs with
      # a token that can deploy the worker serving pool/ and dists/, so the
      # code it executes has to be the code the lockfile names -- the same
      # reasoning that pins every third-party action to a digest. No `||
      # npm install` fallback: a lockfile that no longer matches package.json
      # is a failure to fix, not to route around.
      - name: Install
        run: npm ci

      - name: Syntax-check the worker
        run: node --check src/worker.js

      - name: Test
        run: npm test

      # Resolve, never create, and never apply DDL. A missing production
      # database is an incident, not something a deploy quietly repairs:
      # creating one would publish an empty archive of counters and make the
      # loss look like a quiet day. Creating the database and applying
      # pkghaus/apt's schema.sql is one deliberate act, done by hand and
      # written down; running CREATE TABLE IF NOT EXISTS on every push did no
      # work and could never have migrated anything anyway.
      - name: Resolve the D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_STATS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "pkghaus-stats") | .uuid')"
          if [ -z "$id" ]; then
            echo "::error title=D1 database missing::pkghaus-stats does not exist in this account. Create it deliberately and restore from the newest Export D1 artifact; do not let a deploy recreate it empty."
            exit 1
          fi
          sed -i "s/PLACEHOLDER_RESOLVED_IN_CI/$id/" wrangler.toml

      - name: Deploy the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_STATS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
