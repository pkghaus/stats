name: Export D1

# The download counters exist in exactly one place: the D1 database. R2 has
# no versioning and D1's own point-in-time restore is a short window, so an
# export taken off-platform is the only thing that survives losing the
# database. Weekly, because the dump is a full snapshot -- the newest
# artifact always carries the whole history, so retention bounds how stale a
# recovery can be, not how much of the past is kept.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-d1
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # wrangler.toml carries PLACEHOLDER_RESOLVED_IN_CI rather than the real
      # database id, so that nothing here can create a database by deploying
      # against an id that does not exist. Every workflow that runs wrangler
      # against this config has to resolve it first -- deploy.yml does the same
      # thing, and this workflow not doing it is why the first scheduled export
      # failed with "Invalid property: databaseId => Invalid uuid".
      - name: Resolve the database id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_STATS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "pkghaus-stats") | .uuid')"
          if [ -z "$id" ]; then
            echo "::error title=D1 database missing::pkghaus-stats does not exist in this account. There is nothing to export; investigate before restoring."
            exit 1
          fi
          sed -i "s/PLACEHOLDER_RESOLVED_IN_CI/$id/" wrangler.toml

      - name: Export the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_STATS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A leftover placeholder here means the step above did not run or did
          # not match, and wrangler's own error for it names a uuid rather than
          # the cause. Fail on the cause instead.
          if grep -q PLACEHOLDER_RESOLVED_IN_CI wrangler.toml; then
            echo "::error title=Unresolved database id::wrangler.toml still carries the placeholder; the resolve step did not substitute it"
            exit 1
          fi
          npx wrangler d1 export pkghaus-stats --remote --output stats-backup.sql
          test -s stats-backup.sql
          # A dump with no rows is what a broken export and a wiped database
          # look like alike, and neither should be stored as this week's
          # backup without someone noticing.
          rows="$(grep -c '^INSERT INTO' stats-backup.sql || true)"
          if [ "$rows" -eq 0 ]; then
            echo "::error title=Empty D1 export::the dump carries no INSERT statements; not a usable backup"
            exit 1
          fi
          # Structure and row counts only: the file itself carries the data.
          echo "bytes: $(wc -c < stats-backup.sql)  insert statements: $rows"
          echo "tables:"
          grep -oE 'CREATE TABLE [^ (]+' stats-backup.sql | sort -u | sed 's/^/  /'
          echo "insert statements per table:"
          grep -oE 'INSERT INTO "?[A-Za-z_]+"?' stats-backup.sql | sort | uniq -c | sed 's/^/  /'

      - name: Upload the dump
        uses: actions/upload-artifact@v7
        with:
          name: d1-export
          path: stats-backup.sql
          retention-days: 90
          if-no-files-found: error
