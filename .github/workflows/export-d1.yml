name: Export D1

# Operator-run backup of the download counters. The Cloudflare account move
# discards the old account's D1, and the counts do not travel with it, so the
# export has to be taken before the transfer and imported after.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Export the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 d1 export pkghaus-stats --remote --output stats-backup.sql
          test -s stats-backup.sql
          # Structure and row counts only: the file itself carries the data.
          echo "bytes: $(wc -c < stats-backup.sql)  lines: $(wc -l < stats-backup.sql)"
          echo "tables:"
          grep -oE 'CREATE TABLE [^ (]+' stats-backup.sql | sort -u | sed 's/^/  /'
          echo "insert statements per table:"
          grep -oE 'INSERT INTO "?[A-Za-z_]+"?' stats-backup.sql | sort | uniq -c | sed 's/^/  /'

      - name: Upload the dump
        uses: actions/upload-artifact@v4
        with:
          name: d1-export
          path: stats-backup.sql
          retention-days: 90
          if-no-files-found: error
