name = "pkghaus-stats"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# The page only. pool/ and dists/ belong to pkghaus-archive, deployed from
# pkghaus/apt, which holds the R2 binding and writes the counters read here.
# This pattern is more specific than anything that Worker matches, and
# Cloudflare resolves overlapping routes by specificity, so the page keeps
# working whatever the archive Worker grows to cover.
#
# Fail open costs nothing here: the page stops updating and nothing else
# changes.
routes = [
  { pattern = "apt.pkg.haus/stats*", zone_name = "pkg.haus" },
]

[[d1_databases]]
binding = "DB"
database_name = "pkghaus-stats"
# Resolved by CI at deploy time (see .github/workflows/deploy.yml), which
# fails if the database is absent rather than creating an empty one.
database_id = "PLACEHOLDER_RESOLVED_IN_CI"

# Workers Logs. Every failure path in the worker is caught so that serving
# survives it, which without this makes a broken counter and a quiet week
# indistinguishable: the console.error calls had nowhere to go. Sampling
# stays at 1 -- this worker's volume is three orders of magnitude under the
# free daily limit, so there is nothing to thin out.
[observability]
enabled = true
head_sampling_rate = 1
